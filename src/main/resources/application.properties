spring.application.name=CaribePay

# MongoDB (Spring Data)
spring.mongodb.uri=${DB_URL:mongodb://localhost:27017/caribepay}

# JWT
jwt.secret=${JWT_SECRET:MiClaveSecretaMuyLargaParaCaribePay123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080

# Logging
logging.level.root=INFO

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms

# Pool de conexiones (Lettuce)
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.shutdown-timeout=2000ms