<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CaribePay | Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="app">
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-mark">C</div>
            <div class="brand-text">
                <h1>CaribePay</h1>
                <p>Tu billetera simple y segura</p>
            </div>
        </div>

        <form id="loginForm" class="form">
            <label class="label" for="email">Correo</label>
            <input class="input" type="email" id="email" placeholder="tu@correo.com" required />

            <label class="label" for="password">Contraseña</label>
            <input class="input" type="password" id="password" placeholder="••••••••" required />

            <button class="btn btn-primary" type="submit">Entrar</button>

            <div class="muted">
                ¿No tienes cuenta? <a class="link" href="registro.html">Crear cuenta</a>
            </div>
        </form>

        <div class="hint">
            Tip: si ya tienes sesión iniciada, te redirigimos al dashboard.
        </div>

        <div class="divider"></div>

        <div class="muted" style="text-align: center; font-size: 12px;">
            ¿No tienes cuenta aún?
            <a class="link" href="landing.html">Ir al inicio</a>
        </div>
    </div>

    <footer class="footer">
        <span>© CaribePay</span>
        <span class="dot">•</span>
        <a class="link" href="landing.html" style="font-size: 12px;">Volver al inicio</a>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
