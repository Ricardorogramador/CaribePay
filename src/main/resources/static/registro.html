<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CaribePay | Registro</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="app">
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-mark">C</div>
            <div class="brand-text">
                <h1>Crear cuenta</h1>
                <p>Colombia (+57)</p>
            </div>
        </div>

        <form id="registerForm" class="form">
            <label class="label" for="email">Correo</label>
            <input class="input" type="email" id="email" placeholder="tu@correo.com" required />

            <label class="label" for="telefono">Teléfono</label>
            <input class="input" type="tel" id="telefono" placeholder="3123456789 o +573123456789" required />

            <label class="label" for="password">Contraseña</label>
            <input class="input" type="password" id="password" placeholder="Mínimo 6 caracteres" required />

            <button class="btn btn-primary" type="submit">Registrarme</button>

            <div class="muted">
                ¿Ya tienes cuenta? <a class="link" href="index.html">Volver al login</a>
            </div>
        </form>

        <div class="hint">
            Usaremos tu teléfono para enviar/recibir dinero. (Normalizamos a +57XXXXXXXXXX)
        </div>
    </div>

    <footer class="footer">
        <span>© CaribePay</span>
        <span class="dot">•</span>
        <span>Local</span>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
