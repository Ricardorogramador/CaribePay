<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CaribePay | Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app">
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark sm">👑</div>
      <div class="sidebar-brand-text">
        <div class="sidebar-title">CaribePay</div>
        <div class="sidebar-subtitle">Admin</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item active" href="javascript:adminMostrarEstadisticas()">📊 Panel</a>
      <a class="nav-item" href="javascript:adminMostrarUsuarios()">👥 Usuarios</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost w-full" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-title">Panel de Administración</h2>
        <p class="page-subtitle" id="welcomeText">Bienvenido admin</p>
      </div>

      <div class="topbar-right">
        <button class="btn btn-soft" onclick="adminRecargarDatos()">Actualizar</button>
      </div>
    </header>

    <!-- ESTADÍSTICAS -->
    <section id="seccionEstadisticas" class="grid">
      <div class="card">
        <div class="stat">
          <div class="stat-label">Total de Usuarios</div>
          <div class="stat-value stat-large" id="totalUsuarios">0</div>
        </div>
      </div>

      <div class="card">
        <div class="stat">
          <div class="stat-label">Usuarios Activos</div>
          <div class="stat-value stat-large stat-green" id="usuariosActivos">0</div>
        </div>
      </div>

      <div class="card">
        <div class="stat">
          <div class="stat-label">Usuarios Desactivados</div>
          <div class="stat-value stat-large stat-red" id="usuariosDesactivados">0</div>
        </div>
      </div>

      <div class="card">
        <div class="stat">
          <div class="stat-label">Saldo Circulante</div>
          <div class="stat-value stat-large" id="saldoTotal">$ 0</div>
        </div>
      </div>
    </section>

    <!-- USUARIOS -->
    <section id="seccionUsuarios" class="grid" style="display: none;">
      <div class="card span-2">
        <div class="card-head">
          <div>
            <div class="card-title">Gestión de Usuarios</div>
            <div class="card-muted">Ver y controlar cuentas de usuario</div>
          </div>
          <div>
            <button class="btn btn-sm btn-soft" onclick="adminFiltrarUsuarios('todos')">Todos</button>
            <button class="btn btn-sm btn-soft" onclick="adminFiltrarUsuarios('activos')">Activos</button>
            <button class="btn btn-sm btn-soft" onclick="adminFiltrarUsuarios('desactivados')">Desactivados</button>
          </div>
        </div>

        <div class="table-container">
          <table class="admin-table">
            <thead>
            <tr>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Saldo</th>
              <th>Estado</th>
              <th>Registro</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="usuariosTableBody">
            <tr>
              <td colspan="6" class="text-center muted">Cargando...</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
